name: Unit Tests
on:
  workflow_call:
  push:
    branches:
      - '**'
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - name: v55_linux
            version_number: release-v5.5
          - name: v60_linux
            version_number: release-v6.0
          - name: v61_linux
            version_number: release-v6.1

    steps:
      - uses: actions/checkout@v4

      - name: Build and run ESP-IDF Linux tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.version.version_number }}
          path: test
          command: |
            apt-get update && apt-get install -y --no-install-recommends build-essential libbsd-dev
            unset IDF_TARGET
            idf.py --preview set-target linux
            idf.py build
            ./build/gcm_encryption_tests.elf
